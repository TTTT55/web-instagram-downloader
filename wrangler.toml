# Cloudflare Workers configuration for the full QuickVideoSaver Next.js app.
# OpenNext builds the Next.js app into .open-next/worker.js.
name = "quickvideosaver"
main = ".open-next/worker.js"
compatibility_date = "2026-09-14"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
# Comma-separated Instagram GraphQL doc_ids to try, in order.
IG_DOC_IDS = "27128499623469141,8845758582119845,10015901848480474"
RATE_LIMIT_PER_MINUTE = "30"
# Public AdSense publisher client identifier used by the site verification/ad script.
NEXT_PUBLIC_ADSENSE_CLIENT = "ca-pub-9773847388363945"
